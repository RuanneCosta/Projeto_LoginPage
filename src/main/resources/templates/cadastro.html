<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #5cc8ce;
        }

        .card {
            width: 340px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 32px 34px 28px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #2b3a4a;
            margin-bottom: 22px;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo label {
            display: block;
            font-size: 13px;
            color: #4a5a6a;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d7dde3;
            border-radius: 6px;
            font-size: 14px;
            color: #2b3a4a;
            outline: none;
        }

        .campo input:focus {
            border-color: #1a73e8;
        }

        .campo input::placeholder {
            color: #aab4bd;
        }

        .mensagem-erro {
            background: #fdeceb;
            color: #c0392b;
            font-size: 12.5px;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
        }

        .botao-cadastrar {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: none;
            border-radius: 6px;
            background-color: #1a73e8;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao-cadastrar:hover {
            background-color: #1558b0;
        }

        .link-login {
            display: block;
            text-align: left;
            margin-top: 16px;
            font-size: 13px;
        }

        .link-login a {
            color: #1a73e8;
            text-decoration: none;
        }

        .link-login a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>Cadastro</h1>

    <form method="post" action="/cadastro">

        <p class="mensagem-erro" th:if="${erro}">
            <span th:text="${erro}"></span>
        </p>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <div class="campo">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required>
        </div>

        <button type="submit" class="botao-cadastrar">Cadastrar</button>

    </form>

    <span class="link-login">
        Já tem uma conta? <a href="/login">Entrar</a>
    </span>

</div>

</body>
</html>
